name: Generate F-Droid repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
  - cron: "45 2 * * *"

permissions:
  contents: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  apps:
    name: "Generate repo from apps listing"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Create basic directory structure
        run: mkdir -p fdroid/repo

      - name: Restore correct mtime
        run: |
          sudo apt-get update
          sudo apt-get install -y git-restore-mtime
          git restore-mtime

      # From PyPI, not apt: Ubuntu satisfies fdroidserver's "androguard >= 3.3.5"
      # with androguard 3.x, whose parser rejects resources.arsc as produced by
      # current Android build tools ("res1 must be zero!").
      - name: Install F-Droid server software
        run: |
          sudo apt-get install -y apksigner pipx
          pipx install fdroidserver
          pipx ensurepath
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          fdroid --version
          pipx runpip fdroidserver show androguard | head -2

      - name: Set up repo secrets
        run: |
          echo "${{ secrets.KEYSTORE_P12 }}" | base64 -d - > fdroid/keystore.p12
          echo "${{ secrets.CONFIG_YML }}" | base64 -d - > fdroid/config.yml
          chmod 600 fdroid/config.yml

      - uses: actions/setup-go@v6
        name: Set up Go
        with:
          go-version-file: metascoop/go.mod

      - name: Run update script
        run: bash update.sh 2>&1
        env:
          GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
